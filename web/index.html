<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  // iOS zooms the page when a text field under 16px gets focus (CodeMirror editors, the xterm
  // terminal). maximum-scale stops that auto-zoom; iOS still allows pinch-zoom, and other
  // platforms keep the plain viewport so their pinch-zoom is untouched.
  if (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
    document.querySelector('meta[name=viewport]').setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover')
  }
</script>
<title>Compose 面板</title>
<meta name="description" content="Docker Compose 管理面板">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compose 面板">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

</head>
