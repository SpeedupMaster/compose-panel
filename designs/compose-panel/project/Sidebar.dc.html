<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>侧边导航</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="主导航" style="box-sizing: border-box; width: 100%; min-height: 900px; height: 100%; background: #17181B; color: #E6E6E3; font-family: 'IBM Plex Sans','Noto Sans SC',system-ui,sans-serif; font-size: 14px; display: flex; flex-direction: column; padding: 20px 12px">
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 20px">
    <svg aria-hidden="true" width="28" height="28" viewBox="0 0 28 28" fill="none"><rect x="1" y="1" width="26" height="26" rx="6" fill="#B54708"></rect><path d="M7 11h14M7 15h14M7 19h9" stroke="#fff" stroke-width="2" stroke-linecap="round"></path></svg>
    <div style="display: flex; flex-direction: column; line-height: 1.25">
      <span style="font-weight: 600; font-size: 15px">Compose 面板</span>
      <span style="font-size: 12px; color: #A3A5AA; font-family: 'IBM Plex Mono',monospace">prod-01</span>
    </div>
  </div>

  <a href="Jobs.dc.html" style="display: flex; align-items: center; gap: 10px; margin: 0 4px 16px; padding: 0 10px; height: 36px; border-radius: 6px; background: #24262A; color: #C9CACD; text-decoration: none; font-size: 13px">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 6v6l4 2"></path></svg>
    <span style="flex: 1">运行中任务</span>
    <span style="background: #1D44B8; color: #fff; border-radius: 999px; padding: 0 7px; font-size: 12px; line-height: 20px">2</span>
  </a>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
    <div style="display: flex; flex-direction: column; gap: 2px; margin-bottom: 14px">
      <sc-if value="{{g.title}}" hint-placeholder-val="{{true}}">
        <div style="font-size: 12px; color: #9C9EA3; padding: 0 12px 4px">{{g.title}}</div>
      </sc-if>
      <sc-for list="{{g.items}}" as="item" hint-placeholder-count="2">
        <a href="{{item.href}}" aria-current="{{item.aria}}" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 6px; text-decoration: none; background: {{item.bg}}; color: {{item.fg}}; font-weight: {{item.weight}}">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{item.icon}}"></path></svg>
          <span style="flex: 1">{{item.label}}</span>
          <sc-if value="{{item.alert}}" hint-placeholder-val="{{false}}">
            <span style="background: #F97066; color: #2A0A07; border-radius: 999px; padding: 0 7px; font-size: 12px; line-height: 20px; font-weight: 600">{{item.alert}}</span>
          </sc-if>
        </a>
      </sc-for>
    </div>
  </sc-for>

  <div style="margin-top: auto; border-top: 1px solid #2E3035; padding: 14px 8px 0; display: flex; align-items: center; gap: 10px">
    <div aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; background: #3A3C42; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px">A</div>
    <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.3; min-width: 0">
      <span style="font-weight: 500">admin</span>
      <span style="font-size: 12px; color: #A3A5AA">管理员 · v0.1.0</span>
    </div>
    <a href="Login.dc.html" aria-label="退出登录" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: #C9CACD">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>
    </a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["overview","projects","docker","databases","backups","sites","certs","jobs","integrations","access","settings"],"default":"overview"},"$preview":{"width":232,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'overview';
    const I = {
      overview: 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',
      projects: 'M3 7l9-4 9 4-9 4-9-4zM3 12l9 4 9-4M3 17l9 4 9-4',
      docker: 'M4 6h16v12H4zM4 10h16M9 6v12',
      databases: 'M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3',
      backups: 'M21 12a9 9 0 1 1-3-6.7M21 4v5h-5M12 8v4l3 2',
      sites: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z',
      certs: 'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4',
      jobs: 'M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01',
      integrations: 'M4 7h16v4H4zM4 13h16v4H4zM8 9h.01M8 15h.01',
      access: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8',
      settings: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z'
    };
    const mk = (id, label, href, alert) => {
      const on = id === active;
      return { label, href, icon: I[id], alert: alert || '', aria: on ? 'page' : 'false',
        bg: on ? '#2E3035' : 'transparent', fg: on ? '#FFFFFF' : '#C9CACD', weight: on ? 600 : 400 };
    };
    return {
      groups: [
        { title: '', items: [mk('overview', '总览', 'Main.dc.html'), mk('projects', '项目', 'Projects.dc.html', '1')] },
        { title: '运行时', items: [mk('docker', 'Docker 资源', 'DockerResources.dc.html'), mk('databases', '数据库', 'Databases.dc.html'), mk('backups', '备份', 'Backups.dc.html', '1')] },
        { title: '网络', items: [mk('sites', '站点', 'ProxySites.dc.html'), mk('certs', '证书', 'Certificates.dc.html', '1')] },
        { title: '系统', items: [mk('jobs', '任务中心', 'Jobs.dc.html'), mk('integrations', '存储与通知', 'Integrations.dc.html'), mk('access', '用户与审计', 'Access.dc.html'), mk('settings', '设置', 'Settings.dc.html')] }
      ]
    };
  }
}
</script>
</body>
</html>
